<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A next-gen HRIS Biometrics application with smart innovation.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="R.A.C.O.M.A Admin">

  <title>R.A.C.O.M.A Admin</title>

  <!-- 🆕 INAYOS: Derektang logo1.png lang (dahil nasa web folder siya) -->
  <link rel="icon" type="image/png" href="logo1.png">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F8F9FA;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      color: #333333;
    }
    #loading-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    #loading-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #FF8A00;
    }
  </style>

  <script src="https://unpkg.com/@simplewebauthn/browser@10/dist/bundle/index.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script>
    window.faceApiReady = false;
    window.faceApiError = null;

    window.faceApiLoading = (async () => {
      try {
        const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
          faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
        ]);
        window.faceApiReady = true;
        console.log('✅ face-api.js models loaded');
      } catch (err) {
        window.faceApiError = err;
        console.error('❌ face-api.js model load failed:', err);
      }
    })();

    function _ear(eye) {
      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const v1 = dist(eye[1], eye[5]);
      const v2 = dist(eye[2], eye[4]);
      const h = dist(eye[0], eye[3]);
      return (v1 + v2) / (2.0 * h);
    }

    window.detectFaceLiveness = async function (videoEl) {
      if (!window.faceApiReady || !videoEl) return null;
      const result = await faceapi
        .detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks(true)
        .withFaceExpressions();

      if (!result) return { facePresent: false };

      const lm = result.landmarks.positions;
      const leftEye = lm.slice(36, 42);
      const rightEye = lm.slice(42, 48);
      const avgEar = (_ear(leftEye) + _ear(rightEye)) / 2;
      const happy = result.expressions.happy || 0;

      return {
        facePresent: true,
        eyeOpenScore: avgEar,
        smileScore: happy,
      };
    };
  </script>
</head>
<body>
<div id="loading">
  <!-- 🆕 INAYOS: Derektang logo1.png lang din -->
  <img id="loading-logo" src="logo1.png" alt="Loading Logo" />
  <div id="loading-text">R.A.C.O.M.A. Admin...</div>
</div>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
