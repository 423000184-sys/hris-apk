name: hris_biometrics
description: A next-gen HRIS Biometrics application with smart innovation.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── Firebase ──────────────────────────────────────────────────────
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.3.7
  cloud_functions: ^5.1.3
  firebase_app_check: ^0.3.1+5

  # 🔒 Observability + kill-switch
  firebase_crashlytics: ^4.2.0
  firebase_performance: ^0.10.1+3
  firebase_analytics: ^11.4.1
  firebase_remote_config: ^5.2.0
  firebase_messaging: ^15.2.0

  # ─── Maps & Location ──────────────────────────────────────────────
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_map_cache: ^2.1.0
  http_cache_file_store: ^2.0.0
  network_info_plus: ^5.0.3

  # ─── UI & Animation ───────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  video_player: ^2.8.6

  # ─── Bootstrap UI ─────────────────────────────────────────────────
  bootstrap_icons: ^1.11.3
  flutter_bootstrap_widgets: ^1.0.0

  # ─── Local Database ───────────────────────────────────────────────
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # ─── Biometrics & Security ────────────────────────────────────────
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  jailbreak_root_detection: ^1.1.5
  package_info_plus: ^8.1.0
  device_info_plus: ^10.1.2

  # ─── Face Detection & Recognition ─────────────────────────────────
  google_mlkit_face_detection: ^0.11.0
  flutter_litert: ^1.0.0
  image: ^4.2.0

  # ─── Camera ───────────────────────────────────────────────────────
  camera: ^0.10.5+9
  camera_web: ^0.3.3
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # ─── HTTP & Networking ────────────────────────────────────────────
  http: ^1.2.2
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0
  connectivity_plus: ^6.1.1
  url_launcher: ^6.2.5
  http_certificate_pinning: ^3.0.0

  # ─── State Management ─────────────────────────────────────────────
  provider: ^6.1.2

  # ─── Utilities ────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  collection: ^1.18.0
  rxdart: ^0.28.0

  # ─── Exporting (PDF, Excel, CSV) ──────────────────────────────────
  pdf: ^3.10.8
  printing: ^5.13.1
  syncfusion_flutter_pdf: ^25.2.7
  excel: ^4.0.6
  csv: ^5.0.0

  # ─── Sharing ──────────────────────────────────────────────────────
  share_plus: ^10.1.1

  # ─── NFC ──────────────────────────────────────────────────────────
  nfc_manager: ^3.5.1

  # ─── Background Services ──────────────────────────────────────────
  flutter_ringtone_player: ^4.0.0+4
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # ─── Additional UI Enhancements ───────────────────────────────────
  syncfusion_flutter_datepicker: ^25.1.35
  dropdown_search: ^5.0.6

  # ─── Audio ────────────────────────────────────────────────────────
  audioplayers: ^6.1.0

  # ─── 👆 FINGER-SNAP DETECTION ─────────────────────────────────────
  noise_meter: ^5.0.2

  # ─── Error Tracking ───────────────────────────────────────────────
  sentry_flutter: ^8.10.0

  # ─── 🔔 OneSignal Push Notifications ──────────────────────────────
  onesignal_flutter: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0

  web: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/models/mobilefacenet.tflite
    - assets/videos/hris.mp4
    - assets/images/logo1.png
    - assets/images/logo.png
    - assets/images/imagewithfallback.png