name: hris_biometrics
description: A next-gen HRIS Biometrics application with smart innovation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── Firebase ──────────────────────────────────────────────────────
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.3.7      # ✅ IDINAGDAG — para sa employee photo storage

  # ─── Maps & Location ──────────────────────────────────────────────
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # ─── UI & Animation ───────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1

  # ─── Bootstrap UI ─────────────────────────────────────────────────
  bootstrap_icons: ^1.11.3
  flutter_bootstrap_widgets: ^1.0.0

  # ─── Local Database ───────────────────────────────────────────────
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.4

  # ─── Biometrics & Security ────────────────────────────────────────
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # ─── Face Detection ───────────────────────────────────────────────
  google_mlkit_face_detection: ^0.11.0

  # ─── Camera & Image ───────────────────────────────────────────────
  camera: ^0.10.5+9
  camera_web: ^0.3.3
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  image: ^4.2.0

  # ─── HTTP & Networking ────────────────────────────────────────────
  http: ^1.2.2
  dio: ^5.7.0

  # ─── State Management ─────────────────────────────────────────────
  provider: ^6.1.2

  # ─── Utilities ────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.1.1
  url_launcher: ^6.2.5

  # ─── Exporting (PDF, Excel, CSV) ──────────────────────────────────
  pdf: ^3.10.8
  printing: ^5.13.1
  excel: ^4.0.6
  csv: ^5.0.0

  # ─── NFC ──────────────────────────────────────────────────────────
  nfc_manager: ^3.5.1
  rxdart: ^0.28.0

  # ─── Background Services ──────────────────────────────────────────
  flutter_ringtone_player: ^4.0.0+4
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.2.3

  # ─── Video & Map ──────────────────────────────────────────────────
  video_player: ^2.8.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # ─── Additional UI Enhancements ───────────────────────────────────
  syncfusion_flutter_datepicker: ^25.1.35
  dropdown_search: ^5.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/videos/hris.mp4
    - assets/images/logo1.png