plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.example.hris_biometrics"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.example.hris_biometrics"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
configurations.all {
    resolutionStrategy {
        // Huwag nang i-force ang org.tensorflow
        force 'com.google.ai.edge.litert:litert:1.4.0'
        force 'com.google.ai.edge.litert:litert-api:1.4.0'
    }

    // Alisin ang mga lumang TFLite modules
    exclude group: "org.tensorflow", module: "tensorflow-lite"
    exclude group: "org.tensorflow", module: "tensorflow-lite-api"
    exclude group: "org.tensorflow", module: "tensorflow-lite-gpu"
    exclude group: "org.tensorflow", module: "tensorflow-lite-select-tf-ops"
}

flutter {
    source = "../.."
}